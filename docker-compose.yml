services:
  web:
    build: .
    image: pwsl-div-time-drops-web:latest
    container_name: pwsl-div-time-drops-web
    ports:
      # Published on all interfaces by default so the app is reachable on the
      # LAN/internet. Set APP_BIND=127.0.0.1 if you put a reverse proxy in front.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-America/New_York}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
